[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge-ai"
version = "2.0.0"
description = "Local-first agent skills from documents"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "requests>=2.31"]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
skillforge = "skillforge.cli:main"

[tool.setuptools.packages.find]
include = ["skillforge*"]
